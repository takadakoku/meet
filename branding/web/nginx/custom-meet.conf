# ---- 会社ブランディング（branding/web/nginx/custom-meet.conf） ----
# 公式の仕組みで meet.conf 末尾に追記される。
# 画像は ${CONFIG}/web/branding/ → 起動時に /run/web/config/branding/ へコピーされたものを配信する。

# ロゴ等の配信（^~ により部屋名用の正規表現 location より優先）
location ^~ /branding/ {
    alias /run/web/config/branding/;
}

# ファビコン: title.html が images/favicon.svg を固定参照するため、同URLで会社アイコン(PNG)を返す
location = /images/favicon.svg {
    types { }
    default_type image/png;
    alias /run/web/config/branding/favicon.png;
}

# iOS ホーム画面アイコン（index.html が images/apple-touch-icon.png を参照）
location = /images/apple-touch-icon.png {
    alias /run/web/config/branding/apple-touch-icon.png;
}

# ページ初期表示時のタイトル・OGP（index.html が SSI で title.html を読み込む）。
# 元ファイル: /usr/share/jitsi-meet/title.html（stable-11248-3）。名称・画像のみ変更し、説明文は原文のまま。
location = /title.html {
    alias /run/web/config/branding/title.html;
}

# head 追加用フック（index.html が SSI で plugin.head.html を読み込む）。ロゴ枠サイズの CSS のみ。
location = /plugin.head.html {
    alias /run/web/config/branding/plugin.head.html;
}

# ---- 会議URL発行画面（issuer コンテナ）への中継 ----
# 主催者が ID・パスワードでログインして会議URLを発行する画面。ポートは公開せず、ここからのみ到達する。
location = /host {
    return 301 /host/;
}
location ^~ /host/ {
    # 変数経由にして起動順に依存しない（issuer が未起動でも nginx は起動できる）
    set $issuer_upstream http://issuer:8080;
    proxy_pass $issuer_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    client_max_body_size 16k;
}

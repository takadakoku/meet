<!-- 会社ブランディング: 左上ロゴ枠の拡大（ロゴ＋社名表記を読める大きさで表示するため）
     元ファイル /usr/share/jitsi-meet/plugin.head.html は空（カスタマイズ用フック）。
     logo-with-name.png は 379x124 の2倍解像度で作成し、半分の大きさで表示する。 -->
<style>
  .leftwatermark,
  .welcome .welcome-watermark .watermark.leftwatermark {
    width: 190px;
    height: 62px;
    max-width: 190px;
    max-height: 62px;
  }

  /* ゲスト待機画面の「Log-in / I am the host」ボタン（ユーザー名・パスワード入力）を隠す。
     本構成は JWT 専用でパスワードアカウントが存在せず、押しても必ず失敗して顧客が混乱するため。
     このボタンは JWT を持たない利用者にだけ表示される（主催者には影響しない）。 */
  [data-testid="lobby.loginButton"] { display: none !important; }
</style>

{% extends "base.html" %}
{% block title %}ログイン{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>ログイン</h1>
  <p class="lead">会議URLを発行するには、主催者用のIDとパスワードでログインしてください。</p>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ prefix }}/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="user_id">ID</label>
    <input id="user_id" name="user_id" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="password">パスワード</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="btn-primary">ログイン</button>
  </form>
  <p class="note">お客様（ゲスト）はログイン不要です。お客様にはこの画面ではなく、発行したゲスト用URLをお送りください。</p>
</section>
{% endblock %}
